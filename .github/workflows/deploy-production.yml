name: Deploy production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm install -g firebase-tools
      - run: chmod +x scripts/deploy-prod.sh scripts/smoke-prod.sh
      - run: ./scripts/deploy-prod.sh
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SERVICE_NAME: wealthtrack
          VM_APP_DIR: /opt/wealthtrack
          VM_RUNTIME_USER: wealthtrack
          VM_DB_PATH: /var/lib/wealthtrack/wealthtrack.db
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
